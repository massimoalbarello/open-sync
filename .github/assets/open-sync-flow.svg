<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="164" viewBox="0 0 1240 164" role="img" aria-labelledby="title description">
  <title id="title">Open Sync data flow</title>
  <desc id="description">Your source logic polls any external API and produces a deliverable containing records and assets. The Open Sync engine passes it to your delivery logic, which sends it to your destination.</desc>
  <style>
    text { fill: #24292f; font: 18px system-ui, sans-serif; text-anchor: middle; }
    .node { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.5; }
    .edge { fill: none; stroke: #57606a; stroke-width: 1.5; marker-end: url(#arrow); }
    .arrow { fill: #57606a; }
    .label { font-size: 16px; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; }
      .node { fill: #161b22; stroke: #8b949e; }
      .edge { stroke: #8b949e; }
      .arrow { fill: #8b949e; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrow" d="M0 0 10 5 0 10Z" />
    </marker>
  </defs>
  <rect class="node" x="6" y="44" width="168" height="84" />
  <rect class="node" x="242" y="44" width="168" height="84" />
  <rect class="node" x="618" y="44" width="168" height="84" />
  <rect class="node" x="842" y="44" width="168" height="84" />
  <rect class="node" x="1066" y="44" width="168" height="84" />
  <path class="edge" d="M176 86H240" marker-start="url(#arrow)" />
  <path class="edge" d="M410 86H616" />
  <path class="edge" d="M786 86H840" />
  <path class="edge" d="M1010 86H1064" />
  <text x="90" y="78">Any external</text>
  <text x="90" y="104">API</text>
  <text x="326" y="78">Your source</text>
  <text x="326" y="104">logic</text>
  <text x="702" y="78">Open Sync</text>
  <text x="702" y="104">engine</text>
  <text x="926" y="78">Your delivery</text>
  <text x="926" y="104">logic</text>
  <text x="1150" y="78">Your</text>
  <text x="1150" y="104">destination</text>
  <text class="label" x="208" y="70">poll</text>
  <text class="label" x="514" y="46">Deliverable</text>
  <text class="label" x="514" y="68">records + assets</text>
</svg>
